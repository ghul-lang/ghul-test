# CI/CD pipeline. 

name: CICD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]

# Serialise pushes to main so two concurrent merges don't compute the same
# version number; for pull requests, cancel any superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor (a
    # #major/#minor marker can no longer trigger a bump). A workflow_dispatch
    # `version` input overrides outright; pull request builds get a -beta.<run>
    # prerelease so they never collide with a real release.
    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        version: ${{ github.event.inputs.version }}
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  build:
    name: Build and publish NuGet package
    runs-on: ubuntu-latest

    # The organization hands workflows a read-only token by default, so the
    # push to its package feed has to ask for packages: write itself. Only the
    # push reads it: restore takes the compiler from nuget.org, and registering
    # the feed as a source made every pull request's restore query it with a
    # token the organization does not grant, which answers 403.
    permissions:
      contents: read
      packages: write

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 10
    needs: [version]

    steps:
    - uses: actions/checkout@v7

    # A ghul-cli project test builds for wasm, and its module runs under Node.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Run unit tests
      run: dotnet test tests/tests.ghulproj

    - name: Run integration tests
      run: integration-tests/run-integration-tests.sh

    - name: Create package
      run: dotnet pack -p:Version=${{ needs.version.outputs.package }}

    - name: Upload .NET package artefact
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: nupkg

    - name: Publish package to GitHub
      run: dotnet nuget push ./nupkg/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish package to NuGet
      if: ${{ github.event_name == 'push' }}
      run: dotnet nuget push ./nupkg/*.nupkg -k ${NUGET_TOKEN} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

  create_release:
    needs: [version, build]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name == 'push' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.test.${{ needs.version.outputs.package }}.nupkg \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt
